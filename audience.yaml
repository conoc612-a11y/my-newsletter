독자:
  누구: "서울·경기에서 내 집 마련·갈아타기·투자를 고민하는 실수요자와 투자자"
  이미_아는_것: "청약 기본 구조, LTV·DSR 개념, 취득·보유·양도세의 큰 틀"

중요도_기준:
  - "서울·경기 개발 진행(재개발·재건축·GTX·신도시)이 거주·자산에 직접 영향을 주나"
  - "실거래·시세 변동이 매수·매도 타이밍 판단에 쓸모 있나"
